<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/inspecao_cadastrar.js"defer></script>
    <title>Cadastrar</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>&emsp;
        </nav>
    </header>
    <main>
        <h1>Cadastrar Funcionário</h1>
    </main>
    <form>
        <label for="status">Status:</label><br>
        <select id="status">
            <option value="PENDENTE">PENDENTE</option>
            <option value="REALIZADA">REALIZADA</option>
        </select><br><br>

        <label for="data">Data:</label><br>
        <input type="date" id="data"><br><br>

        <label for="idEquipamento">Código do Equipamento:</label><br>
        <input type="number" id="idEquipamento"><br><br>

        <button id="btn_cad">Cadastrar</button>
    </form>
    <div id="res"></div>
</body>
</html>
